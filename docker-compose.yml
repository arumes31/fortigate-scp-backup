services:
  fortisafe-app:
    container_name: "fortisafe-app"
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # --- General / Timezone Settings ---
      - "TZ=Europe/Vienna"
      - "PORT=8521"
      - "LOG_LEVEL=info"
      - "BACKUP_DIR=backups"
      - "DATA_DIR=/app/data"

      # --- PostgreSQL Configuration ---
      - "PG_HOST=fortisafe-db"
      - "PG_PORT=5432"
      - "PG_USER=postgre"
      - "PG_PASSWORD_FILE=/run/secrets/postgres_password"
      - "PG_DATABASE=firewall_backups"
      # Traffic stays on Compose's private network; use verify-full with a CA
      # when connecting to an external PostgreSQL service.
      - "PGSSLMODE=disable"
      - "PG_MAX_CONNS=50"
      - "PG_CONNECT_RETRIES=10"
      - "PG_CONNECT_BACKOFF_SECONDS=3"

      # --- Authentication & Session Security ---
      - "TOTP_ENABLED=${TOTP_ENABLED:-false}"
      - "TOTP_SECRET_FILE=/run/secrets/totp_secret"
      - "RADIUS_ENABLED=${RADIUS_ENABLED:-false}"
      - "RADIUS_SECRET_FILE=/run/secrets/radius_secret"
      - "RADIUS_SERVER=${RADIUS_SERVER:-localhost}"
      - "RADIUS_PORT=1812"
      - "LOGIN_MAX_ATTEMPTS=5"
      - "LOGIN_LOCKOUT_MINUTES=15"
      - "SESSION_KEY_FILE=/run/secrets/session_key"
      - "BOOTSTRAP_ADMIN_PASSWORD_FILE=/run/secrets/bootstrap_admin_password"
      - "COOKIE_SECURE=${COOKIE_SECURE:-true}"
      - "ENABLE_HSTS=${ENABLE_HSTS:-true}"
      - "TRUST_PROXY_HEADERS=false"

      # --- Encryption at Rest ---
      - "ENCRYPTION_KEY_FILE=/run/secrets/encryption_key"
      - "SSH_KNOWN_HOSTS_FILE=/app/data/ssh_known_hosts"

      # --- SCP & Backup Engine Defaults ---
      - "DEFAULT_SCP_USER=fortisafe"
      - "FORTIGATE_CONFIG_PATH=sys_config"
      - "SCP_TIMEOUT=60"
      - "MAX_CONCURRENT_BACKUPS=10"
      - "CSV_MAX_BYTES=5242880" # Default 5MB upload limit

      # --- SMTP Mail Notifications ---
      - "MAIL_SERVER=smtp.test.com"
      - "MAIL_PORT=25"
      - "MAIL_USER=fortisafe@test.com"
      - "MAIL_PASSWORD=${MAIL_PASSWORD:-}"
      - "MAIL_RECIPIENT=user1@test.com"

      # --- Extension: FGT ADM VPN Config (Optional) ---
      - "EXT_ADM_VPN_CONF=${EXT_ADM_VPN_CONF:-false}"
      - "EXT_FGT_CONF_GEN=${EXT_FGT_CONF_GEN:-false}"
      - "GRAYLOG_URL=${GRAYLOG_URL:-}"
      - "GRAYLOG_TOKEN=${GRAYLOG_TOKEN:-}"
      - "GRAYLOG_SEARCH_TIMEFRAME=86400"
      - "HOOKWISE_URL=${HOOKWISE_URL:-}"
      - "HOOKWISE_TOKEN=${HOOKWISE_TOKEN:-}"

      # --- Extension: Graylog Device Data (Optional) ---
      # Enables the device inventory for the topology page (switch client MAC/IP/VLAN).
      # Requires GRAYLOG_URL and GRAYLOG_TOKEN to be configured above.
      - "EXT_GRAYLOG_DEVICE_DATA=${EXT_GRAYLOG_DEVICE_DATA:-false}"
      # Graylog query template (%s = firewall hostname); must match logs with MAC fields.
      # - "GRAYLOG_DEVICE_QUERY=source:\"%s\" AND (mac:* OR srcmac:* OR macaddr:*)"
      # Seconds of log history to scan per fetch (default: 86400 = 24h).
      # - "GRAYLOG_DEVICE_RANGE=86400"
      # Background refresh interval in seconds (default: 3600 = 1h).
      # - "GRAYLOG_DEVICE_INTERVAL=3600"

      # --- Extension: Policy Split Advisor (Optional) ---
      # Analyzes a policy's real traffic (Graylog) and recommends how to split
      # open policies into tightly-scoped ones, with ready-to-paste CLI.
      # Requires GRAYLOG_URL and GRAYLOG_TOKEN to be configured above.
      - "EXT_FGT_POLSPLIT=${EXT_FGT_POLSPLIT:-false}"
      # Traffic-log query template (source:"%s" = firewall hostname, policyid:%s = policy ID).
      # - "GRAYLOG_POLSPLIT_QUERY=source:\"%s\" AND policyid:%s AND _exists_:srcip AND _exists_:dstip"
      # Extra internet-facing interface names (comma-separated), merged with the
      # auto-detected ones (set role wan, SD-WAN members, virtual-wan-link).
      # - "POLSPLIT_WAN_INTERFACES=wan1,wan2"

      # --- Extension: Configuration Conversions (Optional) ---
      # Structural migration recipes (interfaces->FortiLink, WAN->SD-WAN, etc.)
      # run against the latest config backup, producing a reviewable CLI script.
      - "EXT_FGT_CONFCONV=${EXT_FGT_CONFCONV:-false}"

      # --- Live SSH Diagnostics (Optional, part of Graylog Device Data) ---
      # Queries the FortiGate CLI over SSH (reusing each firewall's stored SSH
      # credentials) for authoritative per-switch-port link state, STP role/state
      # and interlink/uplink trunks — data the logs only reveal partially. Feeds
      # the same topology faceplate; requires EXT_GRAYLOG_DEVICE_DATA=true.
      - "FGT_DIAG_SSH_ENABLED=false"
      # Background sweep cadence per device (default: 3600 = 1h).
      # - "FGT_DIAG_SSH_BACKGROUND_SECONDS=3600"
      # Min spacing when the topology page/live button triggers a query (default: 1200 = 20m).
      # - "FGT_DIAG_SSH_VIEW_SECONDS=1200"
      # Min spacing between query starts per device (default: 2s); only one query
      # runs at a time per device regardless, so collections are effectively spaced
      # by their own duration.
      # - "FGT_DIAG_SSH_FLOOR_SECONDS=2"
      # Overall SSH session timeout per device (default: 90s).
      # - "FGT_DIAG_SSH_TIMEOUT_SECONDS=90"

      # --- Housekeeping ---
      - "ACTIVITY_LOG_RETENTION_DAYS=0" # 0 means keep logs indefinitely
    ports:
      # Loopback-only: place a trusted same-host HTTPS reverse proxy in front.
      - "127.0.0.1:8521:8521/tcp"
    volumes:
      # Mount host directories to persist backups and configuration/SQLite db files:
      - "./backups:/app/backups"
      - "./data:/app/data"
      # Or specify host absolute paths if required:
      # - "/mnt/backups:/app/backups"
      # - "/mnt/data_fgt-adm-vpn-conf:/app/data"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_password
      - session_key
      - encryption_key
      - bootstrap_admin_password
      - totp_secret
      - radius_secret
    depends_on:
      fortisafe-db:
        condition: service_healthy
        restart: true

  fortisafe-db:
    container_name: "fortisafe-db"
    # PINNED to postgres:16-alpine. Postgres refuses to open a data directory
    # created by a DIFFERENT major version — in both directions. That includes
    # the downgrade case: a ./pgdata initialized by an earlier revision of this
    # file that used postgres:latest (i.e. 17/18) will NOT start under 16.
    #
    # Before changing this tag or reusing an existing ./pgdata, check which
    # major version created the data directory:
    #   cat ./pgdata/PG_VERSION
    # If it differs from the image's major version, migrate via a tested
    # dump/restore — never delete or replace ./pgdata before the dump is
    # taken and the restore verified:
    # 1. Start a container with the SAME major version PG_VERSION reports,
    #    then dump the firewall_backups database:
    #    docker exec -t fortisafe-db pg_dump -U postgre firewall_backups > backup.sql
    # 2. Stop the container and move the old ./pgdata aside (keep it until
    #    the restore is verified).
    # 3. Start this pinned image (it initializes a fresh ./pgdata).
    # 4. Restore the dump:
    #    docker exec -i fortisafe-db psql -U postgre -d firewall_backups --set ON_ERROR_STOP=1 < backup.sql
    #
    # If your data still lives in the fortisafe-db-data named volume (used by
    # earlier revisions of this file), dump from there the same way — with an
    # image matching that volume's PG_VERSION — before switching to the
    # ./pgdata bind mount, or restore the old volume mapping instead.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      - "POSTGRES_USER=postgre"
      - "POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password"
      - "POSTGRES_DB=firewall_backups"
    restart: unless-stopped
    secrets:
      - postgres_password
    volumes:
      - "./pgdata:/var/lib/postgresql/data"
      # Or specify host absolute path:
      # - "/mnt/postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgre -d firewall_backups"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  session_key:
    file: ./secrets/session_key
  encryption_key:
    file: ./secrets/encryption_key
  bootstrap_admin_password:
    file: ./secrets/bootstrap_admin_password
  totp_secret:
    file: ./secrets/totp_secret
  radius_secret:
    file: ./secrets/radius_secret


