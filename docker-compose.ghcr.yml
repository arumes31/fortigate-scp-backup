services:
  fortisafe-app:
    container_name: "fortisafe-app"
    # Set FORTISAFE_IMAGE to a release digest, for example
    # ghcr.io/arumes31/fortigate-scp-backup@sha256:<digest>.
    image: "${FORTISAFE_IMAGE:?Set FORTISAFE_IMAGE to an immutable GHCR digest}"
    environment:
      # --- General / Timezone Settings ---
      - "TZ=Europe/Vienna"
      - "PORT=8521"
      - "LOG_LEVEL=info"
      - "BACKUP_DIR=backups"
      - "DATA_DIR=/app/data"

      # --- PostgreSQL Configuration ---
      - "PG_HOST=fortisafe-db"
      - "PG_PORT=5432"
      - "PG_USER=postgre"
      - "PG_PASSWORD_FILE=/run/secrets/postgres_password"
      - "PG_DATABASE=firewall_backups"
      - "PGSSLMODE=disable"
      - "PG_MAX_CONNS=50"
      - "PG_CONNECT_RETRIES=10"
      - "PG_CONNECT_BACKOFF_SECONDS=3"

      # --- Authentication & Session Security ---
      - "TOTP_ENABLED=${TOTP_ENABLED:-false}"
      - "TOTP_SECRET_FILE=/run/secrets/totp_secret"
      - "RADIUS_ENABLED=${RADIUS_ENABLED:-false}"
      - "RADIUS_SECRET_FILE=/run/secrets/radius_secret"
      - "RADIUS_SERVER=${RADIUS_SERVER:-localhost}"
      - "RADIUS_PORT=1812"
      - "LOGIN_MAX_ATTEMPTS=5"
      - "LOGIN_LOCKOUT_MINUTES=15"
      - "SESSION_KEY_FILE=/run/secrets/session_key"
      - "BOOTSTRAP_ADMIN_PASSWORD_FILE=/run/secrets/bootstrap_admin_password"
      - "COOKIE_SECURE=${COOKIE_SECURE:-true}"
      - "ENABLE_HSTS=${ENABLE_HSTS:-true}"
      - "TRUST_PROXY_HEADERS=false"

      # --- Encryption at Rest ---
      - "ENCRYPTION_KEY_FILE=/run/secrets/encryption_key"
      - "SSH_KNOWN_HOSTS_FILE=/app/data/ssh_known_hosts"

      # --- SCP & Backup Engine Defaults ---
      - "DEFAULT_SCP_USER=fortisafe"
      - "FORTIGATE_CONFIG_PATH=sys_config"
      - "SCP_TIMEOUT=60"
      - "MAX_CONCURRENT_BACKUPS=10"
      - "CSV_MAX_BYTES=5242880" # Default 5MB upload limit

      # --- SMTP Mail Notifications ---
      - "MAIL_SERVER=smtp.test.com"
      - "MAIL_PORT=25"
      - "MAIL_USER=fortisafe@test.com"
      - "MAIL_PASSWORD=${MAIL_PASSWORD:-}"
      - "MAIL_RECIPIENT=user1@test.com"

      # --- Extension: FGT ADM VPN Config (Optional) ---
      - "EXT_ADM_VPN_CONF=${EXT_ADM_VPN_CONF:-false}"
      - "GRAYLOG_URL=${GRAYLOG_URL:-}"
      - "GRAYLOG_TOKEN=${GRAYLOG_TOKEN:-}"
      - "GRAYLOG_SEARCH_TIMEFRAME=86400"
      - "HOOKWISE_URL=${HOOKWISE_URL:-}"
      - "HOOKWISE_TOKEN=${HOOKWISE_TOKEN:-}"

      # --- Extension: Graylog Device Data (Optional) ---
      # Enables the device inventory for the topology page (switch client MAC/IP/VLAN).
      # Requires GRAYLOG_URL and GRAYLOG_TOKEN to be configured above.
      - "EXT_GRAYLOG_DEVICE_DATA=${EXT_GRAYLOG_DEVICE_DATA:-false}"
      # Graylog query template (%s = firewall hostname); must match logs with MAC fields.
      # - "GRAYLOG_DEVICE_QUERY=source:\"%s\" AND (mac:* OR srcmac:* OR macaddr:*)"
      # Seconds of log history to scan per fetch (default: 86400 = 24h).
      # - "GRAYLOG_DEVICE_RANGE=86400"
      # Background refresh interval in seconds (default: 3600 = 1h).
      # - "GRAYLOG_DEVICE_INTERVAL=3600"

      # --- Housekeeping ---
      - "ACTIVITY_LOG_RETENTION_DAYS=0" # 0 means keep logs indefinitely
    ports:
      - "8521:8521/tcp"
    volumes:
      # Mount host directories to persist backups and configuration/SQLite db files:
      - "./backups:/app/backups"
      - "./data:/app/data"
      # Or specify host absolute paths if required:
      # - "/mnt/backups:/app/backups"
      # - "/mnt/data_fgt-adm-vpn-conf:/app/data"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_password
      - session_key
      - encryption_key
      - bootstrap_admin_password
      - totp_secret
      - radius_secret
    depends_on:
      fortisafe-db:
        condition: service_healthy
        restart: true

  fortisafe-db:
    container_name: "fortisafe-db"
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      - "POSTGRES_USER=postgre"
      - "POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password"
      - "POSTGRES_DB=firewall_backups"
    restart: unless-stopped
    secrets:
      - postgres_password
    volumes:
      - "./pgdata:/var/lib/postgresql/data"
      # Or specify host absolute path:
      # - "/mnt/postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgre -d firewall_backups"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  session_key:
    file: ./secrets/session_key
  encryption_key:
    file: ./secrets/encryption_key
  bootstrap_admin_password:
    file: ./secrets/bootstrap_admin_password
  totp_secret:
    file: ./secrets/totp_secret
  radius_secret:
    file: ./secrets/radius_secret
