{{define "webui.shell"}}<!DOCTYPE html>
<html lang="{{.Base.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Base.Title}} · FortiSafe</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/app.css">
    {{block "webui.head" .}}{{end}}
</head>
<body>
    <div class="app-shell">
        <aside class="app-rail">
            <a class="brand" href="/dashboard">FortiSafe</a>
            <nav aria-label="Primary navigation">
                {{range .Base.Navigation}}
                <section class="nav-group" aria-label="{{.Label}}">
                    <h2>{{.Label}}</h2>
                    {{range .Items}}<a href="{{.Href}}"{{if .Current}} aria-current="page"{{end}}>{{.Label}}</a>{{end}}
                </section>
                {{end}}
            </nav>
        </aside>
        <div class="app-workspace">
            <header class="app-utilities"><span>{{.Base.Username}}</span></header>
            <main id="main-content">{{block "webui.content" .}}{{end}}</main>
        </div>
    </div>
    {{block "webui.scripts" .}}{{end}}
</body>
</html>{{end}}
