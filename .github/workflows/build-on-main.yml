name: Build and Push on main

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_quality_failure:
        description: Exercise the publication guard by forcing CI to fail
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-on-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Required quality gates
    uses: ./.github/workflows/ci.yml
    with:
      force_quality_failure: ${{ inputs.force_quality_failure || false }}

  publish:
    name: Build, stage, and promote tested image
    needs: quality
    if: github.ref == 'refs/heads/main' && needs.quality.result == 'success'
    uses: ./.github/workflows/image-pipeline.yml
    with:
      channel: main
    secrets: inherit
